services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      SERVER_NAME: backend
      SERVER_TYPE: internal_backend
      HEALTH_FAIL_RATE: 0
    networks:
      - my-network

  loadbalancer:
    build:
      context: .
      dockerfile: loadbalancer/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - my-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      METRICS_URL: http://loadbalancer:9090/metrics
    env_file:
      - ".env"
    depends_on:
      - loadbalancer
    networks:
      - my-network

networks:
  my-network:
    driver: bridge